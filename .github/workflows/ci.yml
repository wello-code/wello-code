name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` on purpose. package.json pins packageManager (pnpm@11.x), and
      # action-setup v4 REFUSES to start when a version is given in both places
      # rather than risking a mismatch. That is what failed every run since the
      # repository was created — before a single one of our own steps ran.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @wello-code/design-system lint:tokens
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: packaged-app smoke (renderer hardening)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` on purpose. package.json pins packageManager (pnpm@11.x), and
      # action-setup v4 REFUSES to start when a version is given in both places
      # rather than risking a mismatch. That is what failed every run since the
      # repository was created — before a single one of our own steps ran.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Electron needs a display and a few system libraries on headless Linux.
      - name: Install Electron runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libgtk-3-0 libgbm1 libasound2t64
      - name: Run packaged-app smoke under xvfb
        run: xvfb-run -a pnpm --filter @wello-code/desktop test:e2e

  linux-package:
    name: pack the Linux build (no publish)
    # Only on main: packing takes minutes and the answer it gives ("does the
    # Linux installer still assemble") does not change per pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wello-code/desktop build
      # The same command the release runs, minus publishing. Catches a broken
      # Linux target on the commit that broke it rather than on release day —
      # and the artifact below is a build people can try before a release exists.
      #
      # The failure path echoes the tail of the output as a workflow ERROR
      # annotation: annotations are readable without repository admin rights,
      # while raw job logs are not. When this broke the first time, "Process
      # completed with exit code 1" was all anyone outside the org could see.
      - name: Pack AppImage + deb
        run: |
          set -o pipefail
          if ! pnpm --filter @wello-code/desktop exec electron-builder --linux --publish never 2>&1 | tee /tmp/electron-builder.log; then
            echo "::error title=electron-builder --linux failed::$(tail -c 1200 /tmp/electron-builder.log | tr '\n' ' ')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wello-code-linux
          path: |
            apps/desktop/release/installer/*.AppImage
            apps/desktop/release/installer/*.deb
          retention-days: 14
          if-no-files-found: error
